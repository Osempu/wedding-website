# Server block - main configuration
server {
    # Listen on port 80 (HTTP)
    listen 80;
    
    # Server name (use _ for wildcard, matches any domain)
    server_name _;
    
    # Root directory where files are served from
    # Matches COPY destination in Dockerfile
    root /usr/share/nginx/html;
    
    # Default file to serve (index.html)
    index index.html;
    
    # Charset
    charset utf-8;
    
    # ==========================================
    # GZIP COMPRESSION
    # ==========================================
    # Compress responses to reduce bandwidth
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;  # Only compress files > 1KB
    gzip_comp_level 6;     # Compression level (1-9, 6 is balanced)
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;
    
    # ==========================================
    # STATIC ASSET CACHING
    # ==========================================
    # Cache images, fonts, etc. for 1 year
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Cache CSS and JS for 1 year (Vite adds hash to filenames)
    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # ==========================================
    # SPA ROUTING FALLBACK
    # ==========================================
    # This is the CRITICAL part for React Router
    location / {
        # Try to serve the file directly
        # If not found, try as directory
        # If still not found, fallback to index.html
        try_files $uri $uri/ /index.html;
        
        # Don't cache index.html (may have new deployments)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    # ==========================================
    # ERROR HANDLING
    # ==========================================
    # Custom error page (optional)
    error_page 404 /index.html;
    
    # Hide NGINX version in headers (security)
    server_tokens off;
    
    # ==========================================
    # SECURITY HEADERS
    # ==========================================
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Enable XSS protection
    add_header X-XSS-Protection "1; mode=block" always;
}
